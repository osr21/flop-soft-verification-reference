[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flop-soft-verification-reference"
version = "0.1.0"
description = "Small illustrative non-consensus SOFT profile state machine and vectors"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]